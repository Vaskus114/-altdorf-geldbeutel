    .backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px}.secondary-button{min-height:44px;padding:8px;color:#33271d;background:rgba(132,105,70,.16);border:1px solid #745c40;border-radius:1px;font-weight:700;font-size:12px}.secondary-button.danger{color:#6b171b;border-color:#8b4c48}.backup-note{margin:-8px 0 12px;color:#685744;font-size:10px;font-style:italic;text-align:center}
    .storage-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.summary-card{padding:11px;background:rgba(101,77,48,.12);border:1px solid rgba(93,68,42,.38)}.summary-card small{display:block;color:#76624c;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.summary-card strong{display:block;margin-top:3px;font-family:"Cinzel Decorative",serif;font-size:17px}
    .storage-list{display:grid;gap:10px;margin:14px 0 18px}.storage-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:12px;color:var(--ink);text-align:left;background:rgba(227,211,172,.32);border:1px solid #7d674d}.storage-card .kind{display:grid;place-items:center;width:42px;height:42px;background:rgba(83,57,34,.11);border:1px solid #8a7154;font-size:23px}.storage-card strong{display:block}.storage-card small{display:block;margin-top:3px;color:#6e5d48;font-size:11px}.storage-card .status{font-size:12px;text-align:right}.storage-card.body-card{border-style:double;border-width:3px}.storage-card.carried{box-shadow:inset 4px 0 #3e593d}.storage-card.dropped{box-shadow:inset 4px 0 #7e4a3f}
    .storage-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.storage-money{padding:14px;margin:12px 0;background:rgba(68,49,30,.1);border:1px solid #7d6548}.storage-money-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.storage-money strong{font-family:"Cinzel Decorative",serif;font-size:18px}.storage-money .backup-actions{margin:10px 0 0}
    .item-list{display:grid;gap:8px;margin:12px 0}.item-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px;background:rgba(235,217,176,.3);border-bottom:1px solid #816a4f}.item-row strong{display:block}.item-row small{display:block;margin-top:3px;color:#6b5b48;font-size:11px}.item-actions{display:flex;align-items:center;gap:4px}.mini-button{min-width:38px;min-height:36px;padding:5px 8px;color:#3d3023;background:rgba(126,96,60,.15);border:1px solid #7b6246;font-size:12px}.mini-button.danger{color:#771f24}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:16px;padding-bottom:8px;border-bottom:1px solid #7d674d}.section-title small{color:#6b5b48;font-size:11px}.toggle-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;margin:10px 0;background:rgba(111,82,50,.1);border:1px solid rgba(103,74,44,.35)}.toggle-line button{min-height:38px}
    .hidden{display:none!important}
    @media(min-width:681px){.app{margin-block:24px;min-height:calc(100dvh - 48px)}.modal{align-items:center;padding:24px}.sheet{border-radius:3px}}
    @media(max-width:390px){.character-copy{display:none}.app{padding-inline:14px}.wallet{padding-inline:13px}.coin-image{width:52px;height:52px}.coin strong{font-size:30px}.storage-summary{grid-template-columns:1fr}.backup-actions,.storage-toolbar{grid-template-columns:1fr}.money-inputs{gap:4px}.money-inputs input{padding-inline:8px 24px}.money-inputs small{right:6px}}
    @media(prefers-reduced-motion:no-preference){.sheet{animation:rise .22s ease-out}.action:active,.full-button:active{transform:translate(2px,2px);box-shadow:inset 0 0 16px rgba(0,0,0,.55),1px 2px 0 #080706}@keyframes rise{from{transform:translateY(24px);opacity:.6}}}
  </style>
</head>
<body>
  <main id="app" class="loading">Das Kontobuch wird geöffnet …</main>

  <template id="app-template">
    <main class="app">
      <header class="topbar">
        <div><span class="eyebrow">Münzbuch der Alten Welt</span><h1>Geldbeutel</h1></div>
        <button class="character-button" id="open-characters" aria-label="Charakter wechseln">
          <span class="avatar" id="active-avatar"></span>
          <span class="character-copy"><strong id="active-name"></strong><small id="active-career"></small></span>
          <span aria-hidden="true">⌄</span>
        </button>
      </header>
      <section class="wallet" id="wallet-region">
        <div class="wallet-heading"><span>Was noch in der Börse liegt</span><span class="seal" aria-hidden="true">₰</span></div>
        <div class="coins">
          <article class="coin gold"><img class="coin-image" src="./coin-gold.png" alt=""><strong id="balance-gold">0</strong><small>Goldkronen</small></article>
          <article class="coin silver"><img class="coin-image" src="./coin-silver.png" alt=""><strong id="balance-silver">0</strong><small>Schilling</small></article>
          <article class="coin brass"><img class="coin-image" src="./coin-brass.png" alt=""><strong id="balance-brass">0</strong><small>Pfennige</small></article>
        </div>
        <p class="rate">1 Goldkrone = 20 Schilling = 240 Pfennige</p>
      </section>
      <section class="actions" aria-label="Neue Buchung">
        <button class="action income" data-transaction="income"><span>＋</span>Geld erhalten</button>
        <button class="action expense" data-transaction="expense"><span>−</span>Bezahlen</button>
      </section>
      <button class="storage-launch" id="open-storage">
        <span class="storage-icon" aria-hidden="true">⚿</span>
        <span><strong>Truhen &amp; Lager</strong><small id="storage-summary-line">Keine Lager angelegt</small></span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>
      <section class="ledger">
        <div class="heading"><div><span class="eyebrow">Mit Tinte und Blut vermerkt</span><h2>Das Schuldbuch</h2></div><span id="transaction-count">0</span></div>
        <div id="transaction-list"></div>
      </section>
    </main>
  </template>

  <script>
    (() => {
      "use strict";
      const KEY = "altdorf-geldbeutel-v3";
      const OLD_KEYS = ["altdorf-geldbeutel-v2","altdorf-geldbeutel-v1"];
      const $ = (selector, root = document) => root.querySelector(selector);
      const id = () => `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const escapeHtml = text => String(text).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
      const splitCoins = total => {
        let value = Math.abs(total || 0);
        const gold = Math.floor(value / 240); value %= 240;
        const silver = Math.floor(value / 12);
        return {gold, silver, brass:value % 12};
      };
      const label = total => {
        const coins = splitCoins(total);
        const parts = [];
        if (coins.gold) parts.push(`${coins.gold} GK`);
        if (coins.silver) parts.push(`${coins.silver} S`);
        if (coins.brass || !parts.length) parts.push(`${coins.brass} P`);
        return parts.join(" · ");
      };
      const sanitizeItem = item => ({
        id:item?.id || id(),
        name:String(item?.name || "Gegenstand").slice(0,120),
        quantity:Math.max(1,Math.min(9999,Number(item?.quantity)||1)),
        enc:Math.max(0,Math.min(99999,Number(item?.enc)||0)),
        value:Math.max(0,Number.isSafeInteger(item?.value)?item.value:0),
        note:String(item?.note || "").slice(0,500)
      });
      const ensureCharacter = character => {
        if (!Array.isArray(character.transactions)) character.transactions=[];
        if (!Array.isArray(character.inventory)) character.inventory=[];
        character.inventory=character.inventory.map(sanitizeItem);
        if (!Array.isArray(character.storages)) character.storages=[];
        character.storages=character.storages.map(storage=>({
          id:storage?.id||id(),name:String(storage?.name||"Lager").slice(0,100),type:String(storage?.type||"chest"),carried:Boolean(storage?.carried),money:Number.isSafeInteger(storage?.money)&&storage.money>=0?storage.money:0,items:Array.isArray(storage?.items)?storage.items.map(sanitizeItem):[]
        }));
        if (!Number.isSafeInteger(character.balance)||character.balance<0) character.balance=0;
        return character;
      };
      const freshState = () => {
        const character = ensureCharacter({id:id(),name:"Konrad",career:"Abenteurer",balance:0,transactions:[],inventory:[],storages:[]});
        return {characters:[character],activeId:character.id};
      };
      let state;
      try {
        const raw = localStorage.getItem(KEY) || OLD_KEYS.map(key=>localStorage.getItem(key)).find(Boolean);
        state = raw ? JSON.parse(raw) : freshState();
        if (!state.characters?.length) state = freshState();
        state.characters=state.characters.map(ensureCharacter);
        if (!state.characters.some(character=>character.id===state.activeId)) state.activeId=state.characters[0].id;
      } catch { state = freshState(); }

      const persist = () => localStorage.setItem(KEY, JSON.stringify(state));
      const active = () => state.characters.find(character => character.id === state.activeId) || state.characters[0];
      const itemEnc = item => (Number(item.enc)||0)*(Number(item.quantity)||1);
      const itemValue = item => (Number(item.value)||0)*(Number(item.quantity)||1);
      const itemsEnc = items => (items||[]).reduce((sum,item)=>sum+itemEnc(item),0);
      const bodyEnc = character => itemsEnc(character.inventory)+character.storages.filter(storage=>storage.carried).reduce((sum,storage)=>sum+itemsEnc(storage.items),0);
      const storedEnc = character => character.storages.filter(storage=>!storage.carried).reduce((sum,storage)=>sum+itemsEnc(storage.items),0);
      const storageIcon = type => ({backpack:"🎒",chest:"▣",horse:"♞",cart:"▤",ship:"⚓",room:"⌂",stash:"✦"}[type]||"▣");
      const storageTypeLabel = type => ({backpack:"Rucksack",chest:"Truhe",horse:"Pferd",cart:"Karren",ship:"Schiff",room:"Quartier",stash:"Versteck"}[type]||"Lager");
      const mount = () => {
        const template = $("#app-template").content.cloneNode(true);
        $("#app").replaceWith(template);
        bind(); render();
      };
      const render = () => {
        const character = ensureCharacter(active());
        const coins = splitCoins(character.balance);
        $("#active-avatar").textContent = character.name.charAt(0).toUpperCase();
        $("#active-name").textContent = character.name;
        $("#active-career").textContent = character.career;
        $("#wallet-region").setAttribute("aria-label",`Guthaben von ${character.name}`);
        $("#balance-gold").textContent = coins.gold;
        $("#balance-silver").textContent = coins.silver;
        $("#balance-brass").textContent = coins.brass;
        $("#transaction-count").textContent = character.transactions.length;
        const storageCount=character.storages.length;
        $("#storage-summary-line").textContent=`${storageCount?`${storageCount} ${storageCount===1?"Lager":"Lager"}`:"Keine Lager"} · ${bodyEnc(character)} ENC am Körper`;
        $("#transaction-list").innerHTML = character.transactions.length ? `<div class="transactions">${character.transactions.map(transaction => `
          <article class="transaction">
            <span class="transaction-icon ${transaction.type}">${transaction.type === "income" ? "＋" : "−"}</span>
            <div class="transaction-copy"><strong>${escapeHtml(transaction.note)}</strong><small>${new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(transaction.createdAt))}</small></div>
            <div class="transaction-amount ${transaction.type}"><strong>${transaction.type === "income" ? "+" : "−"} ${label(transaction.amount)}</strong><button class="undo" data-undo="${transaction.id}">rückgängig</button></div>
          </article>`).join("")}</div>` : `<div class="empty"><img class="empty-coin" src="./coin-brass.png" alt=""><h3>Das Buch ist noch leer</h3><p>Noch wurde kein Pfennig verdient – oder verloren.</p></div>`;
        document.querySelectorAll("[data-undo]").forEach(button => button.addEventListener("click", () => undo(button.dataset.undo)));
        persist();
      };
      const modal = content => {
        const layer = document.createElement("div");
        layer.className = "modal"; layer.setAttribute("role","dialog"); layer.setAttribute("aria-modal","true");
        layer.innerHTML = `<button class="backdrop" aria-label="Schließen"></button>${content}`;
        document.body.append(layer); $(".backdrop",layer).addEventListener("click",()=>layer.remove()); return layer;
      };
      const moneyFields = () => `<div class="money-inputs"><label><span>Goldkronen</span><input name="gold" type="number" min="0" inputmode="numeric" placeholder="0"><small>GK</small></label><label><span>Schilling</span><input name="silver" type="number" min="0" inputmode="numeric" placeholder="0"><small>S</small></label><label><span>Pfennige</span><input name="brass" type="number" min="0" inputmode="numeric" placeholder="0"><small>P</small></label></div>`;
      const amountFromForm = form => ["gold","silver","brass"].reduce((sum,name,index)=>sum+(Number(form.elements[name]?.value)||0)*[240,12,1][index],0);

      const characterSheet = () => {
        const layer = modal(`<section class="sheet"><div class="handle"></div><div class="heading"><div><span class="eyebrow">Geldbeutel</span><h2>Charaktere</h2></div><button class="close" aria-label="Schließen">×</button></div>
          <div class="character-list">${state.characters.map(character => `<article class="character-row ${character.id===active().id?"selected":""}"><button class="character-select" data-select="${character.id}"><span class="avatar">${escapeHtml(character.name.charAt(0).toUpperCase())}</span><span><strong>${escapeHtml(character.name)}</strong><small>${escapeHtml(character.career)} · ${label(character.balance)}</small></span></button>${state.characters.length>1?`<button class="delete" data-delete="${character.id}" aria-label="${escapeHtml(character.name)} löschen">×</button>`:""}</article>`).join("")}</div>
          <div class="backup-actions"><button type="button" class="secondary-button" id="backup-character">↓ ${escapeHtml(active().name)} sichern</button><button type="button" class="secondary-button" id="restore-character">↑ Sicherung einlesen</button><input class="hidden" id="backup-file" type="file" accept=".json,application/json"></div>
          <p class="backup-note">Die Sicherung enthält Geldbeutel, Münzbuch, Inventar und alle Truhen/Lager dieses Charakters.</p><button class="full-button" id="new-character">＋ Neuen Charakter anlegen</button></section>`);
        $(".close",layer).addEventListener("click",()=>layer.remove());
        layer.querySelectorAll("[data-select]").forEach(button => button.addEventListener("click",()=>{state.activeId=button.dataset.select;layer.remove();render()}));
        layer.querySelectorAll("[data-delete]").forEach(button => button.addEventListener("click",()=>{const character=state.characters.find(item=>item.id===button.dataset.delete);if(character&&confirm(`${character.name} und alle zugehörigen Daten wirklich löschen?`)){state.characters=state.characters.filter(item=>item.id!==character.id);if(state.activeId===character.id)state.activeId=state.characters[0].id;layer.remove();render();characterSheet()}}));
        $("#backup-character",layer).addEventListener("click",backupCharacter); $("#restore-character",layer).addEventListener("click",()=>$("#backup-file",layer).click()); $("#backup-file",layer).addEventListener("change",event=>restoreCharacter(event,layer)); $("#new-character",layer).addEventListener("click",()=>newCharacter(layer));
      };
      const newCharacter = previous => {
        const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">Neuer Geldbeutel</span><h2>Charakter anlegen</h2></div><button type="button" class="close">×</button></div><label>Name<input name="name" required placeholder="z. B. Johan Kümmerling" autocomplete="off"></label><label>Beruf oder Laufbahn<input name="career" placeholder="z. B. Apotheker" autocomplete="off"></label><button class="full-button">Charakter anlegen</button></form>`);
        layer.classList.add("high"); $(".close",layer).addEventListener("click",()=>layer.remove()); $("form",layer).addEventListener("submit",event=>{event.preventDefault();const data=new FormData(event.currentTarget);const character=ensureCharacter({id:id(),name:String(data.get("name")).trim(),career:String(data.get("career")).trim()||"Abenteurer",balance:0,transactions:[],inventory:[],storages:[]});state.characters.push(character);state.activeId=character.id;layer.remove();previous.remove();render()}); $("input",layer).focus();
      };
      const transactionSheet = type => {
        const character=active(); const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">${escapeHtml(character.name)}</span><h2>${type==="income"?"Geld erhalten":"Bezahlen"}</h2></div><button type="button" class="close">×</button></div>${moneyFields()}<p class="conversion hidden"></p><p class="error hidden">Dafür enthält der Geldbeutel nicht genug Münzen.</p><label>Notiz<input name="note" placeholder="z. B. Übernachtung im Roten Mond" autocomplete="off"></label><button class="full-button ${type}" disabled>${type==="income"?"Dem Geldbeutel hinzufügen":"Ausgabe verbuchen"}</button></form>`);
        layer.classList.add("high"); const form=$("form",layer),submit=$(".full-button",form),conversion=$(".conversion",form),error=$(".error",form); const check=()=>{const value=amountFromForm(form);const enough=type==="income"||value<=character.balance;conversion.classList.toggle("hidden",!value);conversion.textContent=value?`Entspricht ${label(value)}`:"";error.classList.toggle("hidden",enough);submit.disabled=!value||!enough}; form.querySelectorAll('input[type="number"]').forEach(input=>input.addEventListener("input",check)); $(".close",layer).addEventListener("click",()=>layer.remove()); form.addEventListener("submit",event=>{event.preventDefault();const value=amountFromForm(form);if(!value||(type==="expense"&&value>character.balance))return;character.transactions.unshift({id:id(),type,amount:value,note:form.elements.note.value.trim()||(type==="income"?"Einnahme":"Ausgabe"),createdAt:new Date().toISOString()});character.balance+=type==="income"?value:-value;layer.remove();render()});
      };

      const storageSheet = () => {
        const character=ensureCharacter(active());
        const totalItems=character.inventory.length+character.storages.reduce((sum,s)=>sum+s.items.length,0);
        const layer=modal(`<section class="sheet"><div class="handle"></div><div class="heading"><div><span class="eyebrow">${escapeHtml(character.name)}</span><h2>Truhen &amp; Lager</h2></div><button class="close" aria-label="Schließen">×</button></div>
          <div class="storage-summary"><div class="summary-card"><small>Am Körper</small><strong>${bodyEnc(character)} ENC</strong></div><div class="summary-card"><small>In Lagern</small><strong>${storedEnc(character)} ENC</strong></div><div class="summary-card"><small>Gegenstandszeilen</small><strong>${totalItems}</strong></div><div class="summary-card"><small>Eingelagertes Geld</small><strong>${label(character.storages.reduce((sum,s)=>sum+s.money,0))}</strong></div></div>
          <div class="storage-list"><button class="storage-card body-card" data-body><span class="kind">⚔</span><span><strong>Am Körper</strong><small>${character.inventory.length} Gegenstände · ${itemsEnc(character.inventory)} ENC direkt getragen</small></span><span class="status">›</span></button>
          ${character.storages.map(storage=>`<button class="storage-card ${storage.carried?"carried":"dropped"}" data-storage="${storage.id}"><span class="kind">${storageIcon(storage.type)}</span><span><strong>${escapeHtml(storage.name)}</strong><small>${storageTypeLabel(storage.type)} · ${storage.items.length} Gegenstände · ${label(storage.money)}</small></span><span class="status">${storage.carried?"getragen":"gelagert"}<br>›</span></button>`).join("")}</div>
          <button class="full-button" id="new-storage">＋ Neues Lager anlegen</button></section>`);
        $(".close",layer).addEventListener("click",()=>layer.remove()); $("[data-body]",layer).addEventListener("click",()=>{layer.remove();locationSheet("body")}); layer.querySelectorAll("[data-storage]").forEach(button=>button.addEventListener("click",()=>{layer.remove();locationSheet(button.dataset.storage)})); $("#new-storage",layer).addEventListener("click",()=>newStorage(layer));
      };
      const newStorage = previous => {
        const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">Lagerbuch</span><h2>Neues Lager</h2></div><button type="button" class="close">×</button></div><label>Name<input name="name" required placeholder="z. B. Truhe auf der Schwarzen Möwe" autocomplete="off"></label><label>Art<select name="type"><option value="chest">Truhe</option><option value="backpack">Rucksack</option><option value="horse">Pferd</option><option value="cart">Karren</option><option value="ship">Schiff</option><option value="room">Quartier</option><option value="stash">Versteck</option></select></label><p class="hint">Rucksäcke können später als getragen oder abgelegt markiert werden. Getragene Lager zählen zum ENC am Körper.</p><button class="full-button">Lager anlegen</button></form>`);
        layer.classList.add("high"); $(".close",layer).addEventListener("click",()=>layer.remove()); $("form",layer).addEventListener("submit",event=>{event.preventDefault();const data=new FormData(event.currentTarget);const storage={id:id(),name:String(data.get("name")).trim(),type:String(data.get("type")),carried:String(data.get("type"))==="backpack",money:0,items:[]};active().storages.push(storage);persist();layer.remove();previous.remove();storageSheet()}); $("input",layer).focus();
      };
      const locationSheet = locationId => {
        const character=ensureCharacter(active()); const isBody=locationId==="body"; const storage=isBody?null:character.storages.find(s=>s.id===locationId); if(!isBody&&!storage){storageSheet();return}
        const items=isBody?character.inventory:storage.items; const title=isBody?"Am Körper":storage.name; const money=isBody?character.balance:storage.money;
        const layer=modal(`<section class="sheet"><div class="handle"></div><div class="heading"><div><span class="eyebrow">${isBody?"Persönliches Inventar":escapeHtml(storageTypeLabel(storage.type))}</span><h2>${escapeHtml(title)}</h2></div><button class="close" aria-label="Schließen">×</button></div>
          ${!isBody&&storage.type==="backpack"?`<div class="toggle-line"><span><strong>Rucksack ${storage.carried?"getragen":"abgelegt"}</strong><br><small>${storage.carried?"Sein Inhalt zählt zum ENC am Körper.":"Sein Inhalt zählt nicht zum ENC am Körper."}</small></span><button class="secondary-button" id="toggle-carried">${storage.carried?"Ablegen":"Aufnehmen"}</button></div>`:""}
          ${!isBody?`<div class="storage-money"><div class="storage-money-head"><span><small>Eingelagertes Geld</small><strong>${label(money)}</strong></span><span>⚿</span></div><div class="backup-actions"><button class="secondary-button" id="money-in">Geld einlagern</button><button class="secondary-button" id="money-out" ${money?"":"disabled"}>Geld entnehmen</button></div></div>`:""}
          <div class="section-title"><div><span class="eyebrow">Besitz</span><h3>Gegenstände</h3></div><small>${itemsEnc(items)} ENC</small></div>
          <div class="item-list">${items.length?items.map(item=>`<article class="item-row"><span><strong>${escapeHtml(item.name)}${item.quantity>1?` ×${item.quantity}`:""}</strong><small>${itemEnc(item)} ENC gesamt${item.value?` · Wert ${label(itemValue(item))}`:""}${item.note?` · ${escapeHtml(item.note)}`:""}</small></span><span class="item-actions"><button class="mini-button" data-move="${item.id}" title="Verschieben">↔</button><button class="mini-button danger" data-delete-item="${item.id}" title="Löschen">×</button></span></article>`).join(""):`<div class="empty"><h3>Hier liegt noch nichts</h3><p>Füge einen Gegenstand hinzu oder verschiebe Beute hierher.</p></div>`}</div>
          <div class="storage-toolbar"><button class="secondary-button" id="add-item">＋ Gegenstand</button><button class="secondary-button" id="back-storage">← Alle Lager</button></div>
          ${!isBody?`<button class="secondary-button danger" id="delete-storage">Lager löschen</button>`:""}</section>`);
        $(".close",layer).addEventListener("click",()=>layer.remove()); $("#back-storage",layer).addEventListener("click",()=>{layer.remove();storageSheet()}); $("#add-item",layer).addEventListener("click",()=>addItem(locationId,layer));
        layer.querySelectorAll("[data-move]").forEach(button=>button.addEventListener("click",()=>moveItem(locationId,button.dataset.move,layer))); layer.querySelectorAll("[data-delete-item]").forEach(button=>button.addEventListener("click",()=>{const item=items.find(x=>x.id===button.dataset.deleteItem);if(item&&confirm(`${item.name} wirklich löschen?`)){const idx=items.findIndex(x=>x.id===item.id);items.splice(idx,1);persist();layer.remove();locationSheet(locationId)}}));
        if(!isBody){ if(storage.type==="backpack") $("#toggle-carried",layer).addEventListener("click",()=>{storage.carried=!storage.carried;persist();layer.remove();locationSheet(locationId)}); $("#money-in",layer).addEventListener("click",()=>storageMoneySheet(storage,"in",layer)); $("#money-out",layer).addEventListener("click",()=>storageMoneySheet(storage,"out",layer)); $("#delete-storage",layer).addEventListener("click",()=>{if(storage.items.length||storage.money){alert("Leere das Lager zuerst: Gegenstände verschieben und Geld entnehmen.");return}if(confirm(`${storage.name} wirklich löschen?`)){character.storages=character.storages.filter(s=>s.id!==storage.id);persist();layer.remove();storageSheet()}}); }
      };
      const addItem = (locationId,previous) => {
        const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">Inventar</span><h2>Gegenstand hinzufügen</h2></div><button type="button" class="close">×</button></div><label>Name<input name="name" required placeholder="z. B. Hanfseil 10 m" autocomplete="off"></label><div class="storage-toolbar"><label>Anzahl<input name="quantity" type="number" min="1" max="9999" value="1" inputmode="numeric"></label><label>ENC je Stück<input name="enc" type="number" min="0" max="99999" value="0" inputmode="numeric"></label></div><span class="eyebrow">Optionaler Wert je Stück</span>${moneyFields()}<label>Notiz<textarea name="note" placeholder="z. B. aus der Goblinhöhle"></textarea></label><button class="full-button">Gegenstand eintragen</button></form>`);
        layer.classList.add("high"); $(".close",layer).addEventListener("click",()=>layer.remove()); $("form",layer).addEventListener("submit",event=>{event.preventDefault();const form=event.currentTarget;const item=sanitizeItem({id:id(),name:form.elements.name.value.trim(),quantity:Number(form.elements.quantity.value)||1,enc:Number(form.elements.enc.value)||0,value:amountFromForm(form),note:form.elements.note.value.trim()});const character=active();const target=locationId==="body"?character.inventory:character.storages.find(s=>s.id===locationId)?.items;if(!target)return;target.push(item);persist();layer.remove();previous.remove();locationSheet(locationId)}); $("input",layer).focus();
      };
      const moveItem = (fromId,itemId,previous) => {
        const character=active(); const source=fromId==="body"?character.inventory:character.storages.find(s=>s.id===fromId)?.items; const item=source?.find(x=>x.id===itemId); if(!item)return; const destinations=[{id:"body",name:"Am Körper"},...character.storages.map(s=>({id:s.id,name:s.name}))].filter(d=>d.id!==fromId);
        if(!destinations.length){alert("Lege zuerst ein weiteres Lager an.");return}
        const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">Verschieben</span><h2>${escapeHtml(item.name)}</h2></div><button type="button" class="close">×</button></div><label>Ziel<select name="target">${destinations.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("")}</select></label><button class="full-button">Verschieben</button></form>`);
        layer.classList.add("high"); $(".close",layer).addEventListener("click",()=>layer.remove()); $("form",layer).addEventListener("submit",event=>{event.preventDefault();const targetId=event.currentTarget.elements.target.value;const target=targetId==="body"?character.inventory:character.storages.find(s=>s.id===targetId)?.items;if(!target)return;const idx=source.findIndex(x=>x.id===itemId);target.push(source.splice(idx,1)[0]);persist();layer.remove();previous.remove();locationSheet(fromId)});
      };
      const storageMoneySheet = (storage,direction,previous) => {
        const character=active(); const sourceMoney=direction==="in"?character.balance:storage.money; const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">${escapeHtml(storage.name)}</span><h2>${direction==="in"?"Geld einlagern":"Geld entnehmen"}</h2></div><button type="button" class="close">×</button></div>${moneyFields()}<p class="conversion hidden"></p><p class="error hidden">Dafür ist nicht genug Geld verfügbar.</p><button class="full-button" disabled>${direction==="in"?"In das Lager legen":"In den Geldbeutel nehmen"}</button></form>`);
        layer.classList.add("high");const form=$("form",layer),submit=$(".full-button",form),conversion=$(".conversion",form),error=$(".error",form);const check=()=>{const value=amountFromForm(form);const enough=value<=sourceMoney;conversion.classList.toggle("hidden",!value);conversion.textContent=value?`Entspricht ${label(value)}`:"";error.classList.toggle("hidden",enough);submit.disabled=!value||!enough};form.querySelectorAll('input[type="number"]').forEach(input=>input.addEventListener("input",check));$(".close",layer).addEventListener("click",()=>layer.remove());form.addEventListener("submit",event=>{event.preventDefault();const value=amountFromForm(form);if(!value||value>sourceMoney)return;if(direction==="in"){character.balance-=value;storage.money+=value}else{storage.money-=value;character.balance+=value}persist();layer.remove();previous.remove();render();locationSheet(storage.id)});
      };

      const backupCharacter = () => {
        const character=active(); const payload={format:"altdorf-geldbeutel-charakter",version:2,createdAt:new Date().toISOString(),character:{name:character.name,career:character.career,balance:character.balance,transactions:character.transactions,inventory:character.inventory,storages:character.storages}}; const safeName=character.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase()||"charakter"; const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const link=document.createElement("a"); link.href=url; link.download=`${safeName}-geldbeutel.json`; document.body.append(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
      };
      const restoreCharacter = async (event,layer) => {
        const file=event.target.files?.[0]; if(!file)return;
        try{
          const payload=JSON.parse(await file.text()); const source=payload?.character;
          if(payload?.format!=="altdorf-geldbeutel-charakter"||![1,2].includes(payload?.version)||!source)throw new Error("Unbekanntes Sicherungsformat");
          if(typeof source.name!=="string"||!source.name.trim()||source.name.length>80)throw new Error("Ungültiger Charaktername"); if(typeof source.career!=="string"||source.career.length>100)throw new Error("Ungültige Laufbahn"); if(!Number.isSafeInteger(source.balance)||source.balance<0)throw new Error("Ungültiger Münzstand"); if(!Array.isArray(source.transactions)||source.transactions.length>10000)throw new Error("Ungültiges Münzbuch");
          const transactions=source.transactions.map(item=>{if(!item||!["income","expense"].includes(item.type)||!Number.isSafeInteger(item.amount)||item.amount<=0)throw new Error("Fehlerhafte Buchung");const createdAt=new Date(item.createdAt);if(Number.isNaN(createdAt.getTime()))throw new Error("Fehlerhaftes Datum");return{id:id(),type:item.type,amount:item.amount,note:String(item.note||"Buchung").slice(0,300),createdAt:createdAt.toISOString()}});
          const restored=ensureCharacter({id:id(),name:source.name.trim(),career:source.career.trim()||"Abenteurer",balance:source.balance,transactions,inventory:payload.version>=2&&Array.isArray(source.inventory)?source.inventory:[],storages:payload.version>=2&&Array.isArray(source.storages)?source.storages:[]});
          restored.inventory=restored.inventory.map(item=>({...item,id:id()})); restored.storages=restored.storages.map(storage=>({...storage,id:id(),items:storage.items.map(item=>({...item,id:id()}))})); state.characters.push(restored);state.activeId=restored.id;persist();layer.remove();render();alert(`${restored.name} wurde aus der Sicherung wiederhergestellt.`);
        }catch(error){alert(`Die Sicherung konnte nicht gelesen werden: ${error.message}`)}finally{event.target.value=""}
      };
      const undo = transactionId => {const character=active();const transaction=character.transactions.find(item=>item.id===transactionId);if(!transaction)return;const next=character.balance+(transaction.type==="income"?-transaction.amount:transaction.amount);if(next<0){alert("Diese Einnahme kann nicht rückgängig gemacht werden, solange das Geld bereits ausgegeben ist.");return}character.balance=next;character.transactions=character.transactions.filter(item=>item.id!==transactionId);render()};
      const bind=()=>{$("#open-characters").addEventListener("click",characterSheet);$("#open-storage").addEventListener("click",storageSheet);document.querySelectorAll("[data-transaction]").forEach(button=>button.addEventListener("click",()=>transactionSheet(button.dataset.transaction)))};
      mount();
      if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    })();
  </script>
</body>
</html>

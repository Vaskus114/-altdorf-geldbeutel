<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3e1d1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Geldbeutel">
  <meta name="description" content="Lokaler Geldbeutel für Warhammer Fantasy Rollenspiel">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./wallet-icon.svg">
  <link rel="apple-touch-icon" href="./wallet-icon.svg">
  <title>Altdorfer Geldbeutel</title>
  <style>
    :root{--ink:#231d19;--muted:#75685d;--paper:#f1e7d2;--wine:#642c2c;--wine-dark:#3e1d1c;--gold:#c89e45;--line:rgba(79,56,38,.18)}
    *{box-sizing:border-box}
    html{background:#171312;color-scheme:light}
    body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 0%,rgba(183,139,61,.13),transparent 28rem),#171312;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}button{touch-action:manipulation}
    .loading{min-height:100dvh;display:grid;place-items:center;color:var(--paper)}
    .app{width:min(100%,680px);min-height:100dvh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(44px,env(safe-area-inset-bottom));background:linear-gradient(rgba(241,231,210,.96),rgba(241,231,210,.96)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(68,48,34,.08) 3px 4px);box-shadow:0 0 70px #000}
    .topbar,.heading,.wallet-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar{margin-bottom:22px}
    .eyebrow{display:block;color:var(--wine);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,"Times New Roman",serif}h1{font-size:clamp(30px,8vw,42px);line-height:1}h2{font-size:25px;margin-top:4px}
    .character-button{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px;color:var(--ink);background:rgba(255,255,255,.34);border:1px solid var(--line);border-radius:14px}
    .avatar{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;color:#f8e9c7;background:var(--wine);border:2px solid #a47c55;border-radius:50%;font-family:Georgia,serif;font-weight:800}
    .character-copy{display:grid;min-width:0;text-align:left}.character-copy strong,.character-copy small{max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.character-copy small,.character-row small{color:var(--muted);font-size:11px}
    .wallet{position:relative;overflow:hidden;padding:20px;color:#f7ead0;background:radial-gradient(circle at 80% 20%,rgba(218,172,84,.16),transparent 15rem),linear-gradient(145deg,#392a23,#191514);border:1px solid #806544;border-radius:22px;box-shadow:0 18px 35px rgba(37,24,18,.24),inset 0 0 0 3px rgba(255,255,255,.025)}
    .wallet:after{content:"";position:absolute;inset:8px;pointer-events:none;border:1px solid rgba(210,175,111,.14);border-radius:16px}.wallet-heading{position:relative;z-index:1;color:#d5c3a2;font:14px Georgia,serif;letter-spacing:.05em}
    .seal{display:grid;place-items:center;width:34px;height:34px;color:#251a16;background:var(--gold);border-radius:50%;font:800 21px Georgia,serif;box-shadow:inset 0 0 0 3px #8d672d}
    .coins{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 16px}.coin{display:grid;justify-items:center;padding:5px 2px}
    .coin-mark{display:grid;place-items:center;width:38px;height:38px;margin-bottom:8px;color:#2a201a;border-radius:50%;font:800 12px Georgia,serif;box-shadow:inset 0 0 0 3px rgba(51,32,19,.27),0 3px 9px rgba(0,0,0,.4)}
    .gold .coin-mark{background:#d5ad54}.silver .coin-mark{background:#c5c2b8}.brass .coin-mark{background:#b57346}.coin strong{font:700 clamp(28px,9vw,42px) Georgia,serif;line-height:1}.coin small{margin-top:4px;color:#baa98e;font-size:10px}.rate{color:#ad9a7d;font-size:11px;text-align:center}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 30px}.action,.full-button{min-height:54px;border:0;border-radius:14px;color:#fff7e7;font-weight:800;box-shadow:0 5px 10px rgba(75,48,31,.16)}
    .action span{margin-right:7px;font-size:21px;vertical-align:-1px}.income{background:#465e42}.expense{background:var(--wine)}
    .ledger{padding-top:21px;border-top:1px solid var(--line)}.heading>span{display:grid;place-items:center;min-width:30px;height:30px;color:var(--muted);border:1px solid var(--line);border-radius:20px;font-size:12px}
    .empty{display:grid;justify-items:center;padding:42px 15px;color:var(--muted);text-align:center}.empty-coin{display:grid;place-items:center;width:58px;height:58px;margin-bottom:14px;color:#775333;background:#c78b5b;border:4px double #815436;border-radius:50%;font:800 20px Georgia,serif;opacity:.65}.empty h3{color:var(--ink);font-size:19px}.empty p{margin-top:5px;font-size:13px}
    .transactions{margin-top:15px}.transaction{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
    .transaction-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:20px;font-weight:800}.transaction-icon.income{color:#385337;background:#d5dfcb}.transaction-icon.expense{color:var(--wine);background:#e5cfca}
    .transaction-copy{display:grid;min-width:0}.transaction-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.transaction small{margin-top:3px;color:var(--muted);font-size:10px}.transaction-amount{display:grid;justify-items:end;font-size:13px}.transaction-amount.income{color:#42613f;background:transparent}.transaction-amount.expense{color:var(--wine);background:transparent}.undo{padding:3px 0 0;color:var(--muted);background:transparent;border:0;font-size:10px;text-decoration:underline}
    .modal{position:fixed;z-index:20;inset:0;display:grid;align-items:end}.modal.high{z-index:30}.backdrop{position:absolute;inset:0;width:100%;border:0;background:rgba(16,12,10,.68);backdrop-filter:blur(3px)}
    .sheet{position:relative;z-index:1;width:min(100%,680px);max-height:88dvh;margin:0 auto;padding:14px 20px max(24px,env(safe-area-inset-bottom));overflow-y:auto;background:var(--paper);border:1px solid #8e765c;border-radius:24px 24px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.32)}
    .handle{width:42px;height:4px;margin:0 auto 20px;background:#b4a58f;border-radius:4px}.close{width:38px;height:38px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:50%;font-size:24px}
    .character-list{margin:18px 0}.character-row{display:grid;grid-template-columns:1fr auto;align-items:center;margin-bottom:8px;border:1px solid var(--line);border-radius:15px}.character-row.selected{border-color:#8d6043;background:rgba(134,92,61,.08)}
    .character-select{display:flex;align-items:center;gap:12px;min-width:0;padding:11px;color:var(--ink);text-align:left;background:transparent;border:0}.character-select>span:last-child{display:grid;min-width:0}.character-select strong,.character-select small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.delete{width:42px;height:42px;margin-right:5px;color:var(--wine);background:transparent;border:0;font-size:22px}
    .full-button{width:100%;margin-top:4px;background:var(--wine-dark)}.full-button.income{background:#465e42}.full-button.expense{background:var(--wine)}.full-button:disabled{opacity:.42}
    .form{display:grid;gap:16px}.form label{display:grid;gap:7px;color:#5f5147;font-size:12px;font-weight:800}.form input{width:100%;min-height:50px;padding:0 14px;color:var(--ink);background:rgba(255,255,255,.42);border:1px solid #b9a78d;border-radius:12px;outline:none}.form input:focus{border-color:var(--wine);box-shadow:0 0 0 3px rgba(100,44,44,.1)}
    .money-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.money-inputs label{position:relative}.money-inputs label>span{min-height:28px}.money-inputs input{padding-right:32px;font-size:20px;font-weight:800}.money-inputs small{position:absolute;right:11px;bottom:16px;color:var(--muted)}
    .conversion{padding:10px;color:#59442f;background:rgba(196,153,77,.14);border:1px solid rgba(133,96,46,.22);border-radius:10px;font-size:12px;text-align:center}.error{color:var(--wine);font-size:12px;font-weight:700;text-align:center}
    .hidden{display:none!important}
    @media(min-width:681px){.app{margin-block:24px;min-height:calc(100dvh - 48px);border-radius:28px}.modal{align-items:center;padding:24px}.sheet{border-radius:24px}}
    @media(max-width:390px){.character-copy{display:none}.app{padding-inline:14px}.wallet{padding-inline:13px}.coin strong{font-size:30px}}
    @media(prefers-reduced-motion:no-preference){.sheet{animation:rise .22s ease-out}.action:active,.full-button:active{transform:translateY(1px)}@keyframes rise{from{transform:translateY(24px);opacity:.6}}}
  </style>
</head>
<body>
  <main id="app" class="loading">Das Kontobuch wird geöffnet …</main>

  <template id="app-template">
    <main class="app">
      <header class="topbar">
        <div><span class="eyebrow">Altdorfer Kontobuch</span><h1>Geldbeutel</h1></div>
        <button class="character-button" id="open-characters" aria-label="Charakter wechseln">
          <span class="avatar" id="active-avatar"></span>
          <span class="character-copy"><strong id="active-name"></strong><small id="active-career"></small></span>
          <span aria-hidden="true">⌄</span>
        </button>
      </header>
      <section class="wallet" id="wallet-region">
        <div class="wallet-heading"><span>Verfügbares Vermögen</span><span class="seal" aria-hidden="true">₰</span></div>
        <div class="coins">
          <article class="coin gold"><span class="coin-mark">GK</span><strong id="balance-gold">0</strong><small>Goldkronen</small></article>
          <article class="coin silver"><span class="coin-mark">S</span><strong id="balance-silver">0</strong><small>Schilling</small></article>
          <article class="coin brass"><span class="coin-mark">P</span><strong id="balance-brass">0</strong><small>Pfennige</small></article>
        </div>
        <p class="rate">1 Goldkrone = 20 Schilling = 240 Pfennige</p>
      </section>
      <section class="actions" aria-label="Neue Buchung">
        <button class="action income" data-transaction="income"><span>＋</span>Geld erhalten</button>
        <button class="action expense" data-transaction="expense"><span>−</span>Bezahlen</button>
      </section>
      <section class="ledger">
        <div class="heading"><div><span class="eyebrow">Persönliches Kassenbuch</span><h2>Letzte Buchungen</h2></div><span id="transaction-count">0</span></div>
        <div id="transaction-list"></div>
      </section>
    </main>
  </template>

  <script>
    (() => {
      "use strict";
      const KEY = "altdorf-geldbeutel-v2";
      const oldKey = "altdorf-geldbeutel-v1";
      const $ = (selector, root = document) => root.querySelector(selector);
      const id = () => `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const escapeHtml = (text) => String(text).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
      const splitCoins = total => {
        let value = Math.abs(total);
        const gold = Math.floor(value / 240);
        value %= 240;
        const silver = Math.floor(value / 12);
        return {gold, silver, brass:value % 12};
      };
      const label = total => {
        const coins = splitCoins(total);
        const parts = [];
        if (coins.gold) parts.push(`${coins.gold} GK`);
        if (coins.silver) parts.push(`${coins.silver} S`);
        if (coins.brass || !parts.length) parts.push(`${coins.brass} P`);
        return parts.join(" · ");
      };
      const freshState = () => {
        const character = {id:id(),name:"Konrad",career:"Abenteurer",balance:0,transactions:[]};
        return {characters:[character],activeId:character.id};
      };
      let state;
      try {
        const raw = localStorage.getItem(KEY) || localStorage.getItem(oldKey);
        state = raw ? JSON.parse(raw) : freshState();
        if (!state.characters?.length) state = freshState();
      } catch { state = freshState(); }

      const persist = () => localStorage.setItem(KEY, JSON.stringify(state));
      const active = () => state.characters.find(character => character.id === state.activeId) || state.characters[0];
      const mount = () => {
        const template = $("#app-template").content.cloneNode(true);
        $("#app").replaceWith(template);
        bind();
        render();
      };
      const render = () => {
        const character = active();
        const coins = splitCoins(character.balance);
        $("#active-avatar").textContent = character.name.charAt(0).toUpperCase();
        $("#active-name").textContent = character.name;
        $("#active-career").textContent = character.career;
        $("#wallet-region").setAttribute("aria-label",`Guthaben von ${character.name}`);
        $("#balance-gold").textContent = coins.gold;
        $("#balance-silver").textContent = coins.silver;
        $("#balance-brass").textContent = coins.brass;
        $("#transaction-count").textContent = character.transactions.length;
        $("#transaction-list").innerHTML = character.transactions.length ? `<div class="transactions">${character.transactions.map(transaction => `
          <article class="transaction">
            <span class="transaction-icon ${transaction.type}">${transaction.type === "income" ? "＋" : "−"}</span>
            <div class="transaction-copy"><strong>${escapeHtml(transaction.note)}</strong><small>${new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(transaction.createdAt))}</small></div>
            <div class="transaction-amount ${transaction.type}"><strong>${transaction.type === "income" ? "+" : "−"} ${label(transaction.amount)}</strong><button class="undo" data-undo="${transaction.id}">rückgängig</button></div>
          </article>`).join("")}</div>` : `
          <div class="empty"><div class="empty-coin">P</div><h3>Noch keine Buchungen</h3><p>Trage die erste Beute oder eine Ausgabe ein.</p></div>`;
        document.querySelectorAll("[data-undo]").forEach(button => button.addEventListener("click", () => undo(button.dataset.undo)));
        persist();
      };
      const modal = content => {
        const layer = document.createElement("div");
        layer.className = "modal";
        layer.setAttribute("role","dialog");
        layer.setAttribute("aria-modal","true");
        layer.innerHTML = `<button class="backdrop" aria-label="Schließen"></button>${content}`;
        document.body.append(layer);
        $(".backdrop",layer).addEventListener("click",()=>layer.remove());
        return layer;
      };
      const characterSheet = () => {
        const layer = modal(`<section class="sheet"><div class="handle"></div><div class="heading"><div><span class="eyebrow">Geldbeutel</span><h2>Charaktere</h2></div><button class="close" aria-label="Schließen">×</button></div>
          <div class="character-list">${state.characters.map(character => `<article class="character-row ${character.id===active().id?"selected":""}">
            <button class="character-select" data-select="${character.id}"><span class="avatar">${escapeHtml(character.name.charAt(0).toUpperCase())}</span><span><strong>${escapeHtml(character.name)}</strong><small>${escapeHtml(character.career)} · ${label(character.balance)}</small></span></button>
            ${state.characters.length>1?`<button class="delete" data-delete="${character.id}" aria-label="${escapeHtml(character.name)} löschen">×</button>`:""}
          </article>`).join("")}</div><button class="full-button" id="new-character">＋ Neuen Charakter anlegen</button></section>`);
        $(".close",layer).addEventListener("click",()=>layer.remove());
        layer.querySelectorAll("[data-select]").forEach(button => button.addEventListener("click",()=>{state.activeId=button.dataset.select;layer.remove();render()}));
        layer.querySelectorAll("[data-delete]").forEach(button => button.addEventListener("click",()=>{
          const character=state.characters.find(item=>item.id===button.dataset.delete);
          if(character&&confirm(`${character.name} und das gesamte Kassenbuch wirklich löschen?`)){
            state.characters=state.characters.filter(item=>item.id!==character.id);
            if(state.activeId===character.id)state.activeId=state.characters[0].id;
            layer.remove();render();characterSheet();
          }
        }));
        $("#new-character",layer).addEventListener("click",()=>newCharacter(layer));
      };
      const newCharacter = previous => {
        const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">Neuer Geldbeutel</span><h2>Charakter anlegen</h2></div><button type="button" class="close">×</button></div>
          <label>Name<input name="name" required placeholder="z. B. Johan Kümmerling" autocomplete="off"></label>
          <label>Beruf oder Laufbahn<input name="career" placeholder="z. B. Apotheker" autocomplete="off"></label>
          <button class="full-button">Charakter anlegen</button></form>`);
        layer.classList.add("high");$(".close",layer).addEventListener("click",()=>layer.remove());
        $("form",layer).addEventListener("submit",event=>{
          event.preventDefault();const data=new FormData(event.currentTarget);const character={id:id(),name:String(data.get("name")).trim(),career:String(data.get("career")).trim()||"Abenteurer",balance:0,transactions:[]};
          state.characters.push(character);state.activeId=character.id;layer.remove();previous.remove();render();
        });
        $("input",layer).focus();
      };
      const transactionSheet = type => {
        const character=active();
        const layer=modal(`<form class="sheet form"><div class="handle"></div><div class="heading"><div><span class="eyebrow">${escapeHtml(character.name)}</span><h2>${type==="income"?"Geld erhalten":"Bezahlen"}</h2></div><button type="button" class="close">×</button></div>
          <div class="money-inputs">
            <label><span>Goldkronen</span><input name="gold" type="number" min="0" inputmode="numeric" placeholder="0"><small>GK</small></label>
            <label><span>Schilling</span><input name="silver" type="number" min="0" inputmode="numeric" placeholder="0"><small>S</small></label>
            <label><span>Pfennige</span><input name="brass" type="number" min="0" inputmode="numeric" placeholder="0"><small>P</small></label>
          </div><p class="conversion hidden"></p><p class="error hidden">Dafür enthält der Geldbeutel nicht genug Münzen.</p>
          <label>Notiz<input name="note" placeholder="z. B. Übernachtung im Roten Mond" autocomplete="off"></label>
          <button class="full-button ${type}" disabled>${type==="income"?"Dem Geldbeutel hinzufügen":"Ausgabe verbuchen"}</button></form>`);
        layer.classList.add("high");const form=$("form",layer);const submit=$("button[type=submit],.full-button",form);const conversion=$(".conversion",form);const error=$(".error",form);
        const amount=()=>["gold","silver","brass"].reduce((sum,name,index)=>sum+(Number(form.elements[name].value)||0)*[240,12,1][index],0);
        const check=()=>{const value=amount();const enough=type==="income"||value<=character.balance;conversion.classList.toggle("hidden",!value);conversion.textContent=value?`Entspricht ${label(value)}`:"";error.classList.toggle("hidden",enough);submit.disabled=!value||!enough};
        form.querySelectorAll('input[type="number"]').forEach(input=>input.addEventListener("input",check));
        $(".close",layer).addEventListener("click",()=>layer.remove());
        form.addEventListener("submit",event=>{event.preventDefault();const value=amount();if(!value||(type==="expense"&&value>character.balance))return;character.transactions.unshift({id:id(),type,amount:value,note:form.elements.note.value.trim()||(type==="income"?"Einnahme":"Ausgabe"),createdAt:new Date().toISOString()});character.balance+=type==="income"?value:-value;layer.remove();render()});
      };
      const undo = transactionId => {
        const character=active();const transaction=character.transactions.find(item=>item.id===transactionId);if(!transaction)return;
        const next=character.balance+(transaction.type==="income"?-transaction.amount:transaction.amount);
        if(next<0){alert("Diese Einnahme kann nicht rückgängig gemacht werden, solange das Geld bereits ausgegeben ist.");return}
        character.balance=next;character.transactions=character.transactions.filter(item=>item.id!==transactionId);render();
      };
      const bind=()=>{$("#open-characters").addEventListener("click",characterSheet);document.querySelectorAll("[data-transaction]").forEach(button=>button.addEventListener("click",()=>transactionSheet(button.dataset.transaction)))};
      mount();
      if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    })();
  </script>
</body>
</html>

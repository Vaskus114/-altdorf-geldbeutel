<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Geldbeutel">
  <meta name="description" content="Offline-Charaktermanager, Geldbeutel und Lagerverwaltung für Warhammer Fantasy Roleplay 1. Edition">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./wallet-icon.svg">
  <link rel="apple-touch-icon" href="./wallet-icon.svg">
  <title>Altdorfer Geldbeutel – WFRP 1E</title>
  <link rel="stylesheet" href="./styles.css?v=20260912-insanity-magicmods-knighthelm">
</head>
<body>
  <main id="app" class="loading">Das Kontobuch wird geöffnet …</main>

  <template id="app-template">
    <main class="app">
      <header class="topbar">
        <div><span class="eyebrow">Münzbuch der Alten Welt</span><h1>Geldbeutel</h1></div>
        <button class="character-button" id="open-characters" aria-label="Charakter wechseln">
          <span class="avatar" id="active-avatar"></span>
          <span class="character-copy"><strong id="active-name"></strong><small id="active-career"></small></span>
          <span aria-hidden="true">⌄</span>
        </button>
      </header>
      <section class="wallet" id="wallet-region">
        <div class="wallet-heading"><span>Was noch in der Börse liegt</span><span class="seal" aria-hidden="true">₰</span></div>
        <div class="coins">
          <article class="coin gold"><img class="coin-image" src="./coin-gold.png" alt=""><strong id="balance-gold">0</strong><small>Goldkronen</small></article>
          <article class="coin silver"><img class="coin-image" src="./coin-silver.png" alt=""><strong id="balance-silver">0</strong><small>Schilling</small></article>
          <article class="coin brass"><img class="coin-image" src="./coin-brass.png" alt=""><strong id="balance-brass">0</strong><small>Pfennige</small></article>
        </div>
        <p class="rate">1 Goldkrone = 20 Schilling = 240 Pfennige</p>
      </section>
      <section class="actions" aria-label="Neue Buchung">
        <button class="action income" data-transaction="income"><span>＋</span>Geld erhalten</button>
        <button class="action expense" data-transaction="expense"><span>−</span>Bezahlen</button>
      </section>
      <button class="character-launch" id="open-character-sheet">
        <span class="character-icon" aria-hidden="true">☩</span>
        <span><strong>Charakterbogen</strong><small id="character-summary-line">Profil, Kampf, Skills und Magie</small></span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>
      <button class="storage-launch" id="open-storage">
        <span class="storage-icon" aria-hidden="true">⚿</span>
        <span><strong>Truhen &amp; Lager</strong><small id="storage-summary-line">Keine Lager angelegt</small></span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>
      <section class="ledger">
        <div class="heading"><div><span class="eyebrow">Mit Tinte und Blut vermerkt</span><h2>Das Schuldbuch</h2></div><span id="transaction-count">0</span></div>
        <div id="transaction-list"></div>
      </section>
    </main>
  </template>

  <script src="./wfrp1e-data.js?v=20260912-insanity-magicmods-knighthelm"></script>
  <script src="./app.js?v=20260912-insanity-magicmods-knighthelm"></script>
</body>
</html>
